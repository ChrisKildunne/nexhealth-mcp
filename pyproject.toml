[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexhealth-mcp"
version = "0.1.0"
description = "Agent-first MCP server for the NexHealth API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.27.1,<2.0",
    "pyyaml>=6.0",
]

[project.scripts]
nexhealth-mcp = "nexhealth.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["nexhealth"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
